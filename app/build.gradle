plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.vahed.hesabdari'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vahed.hesabdari'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        pip {
            install 'Flask==3.1.3'
        }
    }
}
